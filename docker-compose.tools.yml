# Local development tools, kept separate from docker-compose.yml.
#
# phpMyAdmin: a database browser for the trainer service's MySQL, at http://localhost:8091
# It logs in automatically as the app's database user and is reachable only from this machine.
#
# Start it together with the main file (values come from .env):
#
#   docker compose -f docker-compose.yml -f docker-compose.tools.yml up -d
#
# Stop everything:
#
#   docker compose -f docker-compose.yml -f docker-compose.tools.yml down

services:
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: sportsaura-trainer-phpmyadmin
    environment:
      PMA_HOST: trainer-db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8091}:80"
    depends_on:
      trainer-db:
        condition: service_healthy
    networks:
      - sportsaura-net
