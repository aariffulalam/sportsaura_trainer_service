# Runs the trainer service and its MySQL database.
# Values come from the .env file (copy .env.example to .env first).
#
#   Everything:      docker compose up --build
#   Database only:   docker compose up -d trainer-db

services:
  trainer-db:
    image: mysql:8.4
    container_name: sportsaura-trainer-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - trainer-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sportsaura-net

  trainer-service:
    build: .
    container_name: sportsaura-trainer-service
    env_file:
      - .env
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DB_HOST: trainer-db
      DB_PORT: 3306
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
    depends_on:
      trainer-db:
        condition: service_healthy
    networks:
      - sportsaura-net

volumes:
  trainer-db-data:

networks:
  sportsaura-net:
    driver: bridge
