# All environment-specific values come from environment variables.
# For local development they are read from the .env file in the project root
# (copy .env.example to .env). See README.md for what each variable means.

spring:
  application:
    name: trainer-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sportsaura_trainer}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate only checks that the tables match the entities.
      # Tables are created and changed by Flyway (src/main/resources/db/migration).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8082}

app:
  jwt:
    # Must be the same secret the user service uses to sign tokens.
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
